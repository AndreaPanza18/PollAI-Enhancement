name: CI/CD Pipeline

# La action si attiva solo per commit sul branch dependability
on:
  push:
    branches: [ "dependability" ]
  pull_request:
    branches: [ "dependability" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 
      uses: actions/checkout@v7.0.1

    # Java 21, verificare col team se aggiornare a 25
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B -ntp clean verify

    # Bellissimo badge per il ReadMe, mostra un grafo di copertura
    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v5
      with:
        file: ./webapp/target/site/jacoco/jacoco.xml
        fail_ci_if_error: false
