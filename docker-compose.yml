services:
  ai-module:
    build: 
      context: .
      dockerfile: /modulo-AI/Dockerfile
    env_file:
      - ./secrets.env
    ports:
      - "8050:8050"

  pollai:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    depends_on:
      - ai-module
    env_file:
      - ./secrets.env
    ports:
      - "8060:8060"