name: Docker Build

on:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker:
    runs-on: ubuntu-latest
    name: Build and Push Docker Images
    if: github.ref == 'refs/heads/dependability'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. WEBAPP
      - name: Build and push WebApp
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pollai-webapp:latest
            ${{ secrets.DOCKER_USERNAME }}/pollai-webapp:sha-${{ github.sha }}
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,scope=webapp,mode=max

      # 2. EUREKA SERVER
      - name: Build and push Eureka
        uses: docker/build-push-action@v6
        with:
          context: ./modulo-AI/EurekaServer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pollai-eureka:latest
            ${{ secrets.DOCKER_USERNAME }}/pollai-eureka:sha-${{ github.sha }}
          cache-from: type=gha,scope=eureka
          cache-to: type=gha,scope=eureka,mode=max

      # 3. UOVA SERVICE
      - name: Build and push Uova Service
        uses: docker/build-push-action@v6
        with:
          context: ./modulo-AI/UovaService
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pollai-uova-service:latest
            ${{ secrets.DOCKER_USERNAME }}/pollai-uova-service:sha-${{ github.sha }}
          cache-from: type=gha,scope=uova-service
          cache-to: type=gha,scope=uova-service,mode=max
