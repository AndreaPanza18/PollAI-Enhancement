spring.application.name=PollAI

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crea/aggiorna automaticamente le tabelle sul database (necessario su un DB nuovo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Il piano gratuito Aiven ha max 76 connessioni condivise da tutto il gruppo:
# limitiamo il pool di ogni istanza della webapp
spring.datasource.hikari.maximum-pool-size=5


spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

server.port=${WEBAPP_PORT}
eureka.client.serviceUrl.defaultZone = http://localhost:8761/eureka
