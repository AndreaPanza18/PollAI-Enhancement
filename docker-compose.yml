services:
  eureka:
    build:
      context: moduloAI/EurekaServer
      dockerfile: Dockerfile
    environment:
      AIMODULE_PORT: 8761
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  uova-service:
    build:
      context: moduloAI/UovaService
      dockerfile: Dockerfile
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      EUREKA_SERVER_URL: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOST: uova-service
      UOVA_SERVICE_PORT: 8050
    ports:
      - "${UOVA_SERVICE_PORT:-8050}:8050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      eureka:
        condition: service_healthy
    env_file:
      - ./secrets.env
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
    ports:
      - "${BACKEND_PORT:-8060}:8080"

