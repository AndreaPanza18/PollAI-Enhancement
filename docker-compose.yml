services:
  db:
    image: postgres:14.24-alpine3.23
    env_file:
      - ./secrets.env
    environment:
      POSTGRES_DB: pollai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-module:
    build: "/modulo-AI/."
    depends_on:
      - db
    env_file:
      - ./secrets.env
    ports:
      - "8071:8071"

  pollai:
    build: "/webapp/."
    depends_on:
      - db
      - ai-module
    env_file:
      - ./secrets.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pollai_db
    ports:
      - "8060:8060"
      
volumes:
  postgres_data:
    driver: local